# Resolver configuration for the Shadowsocks containers, mounted read-only over
# /etc/resolv.conf. A container that joins another container's network namespace
# via `network_mode: container:...` does not reliably get Docker's embedded DNS
# address in its own /etc/resolv.conf.
#
# Resolving here is intentional: shadowsocks-rust passes destination domains
# through to ssserver unchanged, so the lookup happens on the server, in the
# clearnet, exactly like the rest of the exit traffic.
#
# Replace with your own resolvers, or with a local one such as 127.0.0.53 if you
# run a systemd-resolved or CoreDNS on the host.
nameserver 1.1.1.1
nameserver 8.8.8.8
options timeout:2 attempts:2
